<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Login - Reescreva</title>
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="header-topo">
        <a href="index.html" class="logo">Reescreva</a>
    </header>
    <main class="container">
        <form id="login-form">
            <h1>Login Reescreva</h1>

            <div id="mensagem-erro" style="color: #ff4d4d; text-align: center; font-weight: bold; margin: 10px 0 10px 0;"></div>

            <div class="input-box">
                <input id="email" placeholder="Usuário" required type="email">
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input id="senha" placeholder="Senha" required type="password">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="esquecer-senha">
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit" class="login">Login</button>

            <div class="cadastrar">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </form>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
